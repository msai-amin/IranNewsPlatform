version: '3.8'

services:
  news-platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iran-news-wire
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/newsdb
      - REDIS_URL=redis://redis:6379
    volumes:
      - ../src:/app/src
      - telegram_sessions:/app/sessions
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - news-network

  postgres:
    image: postgres:15-alpine
    container_name: news-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=newsdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - news-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: news-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - news-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  telegram_sessions:

networks:
  news-network:
    driver: bridge
